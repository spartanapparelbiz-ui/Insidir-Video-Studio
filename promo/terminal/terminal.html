<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Insidir terminal</title>
<style>
  @font-face { font-family: "JBM"; src: url("../../insidir_studio/fonts/JetBrainsMono-Medium.ttf"); font-weight: 500; }
  @font-face { font-family: "JBM"; src: url("../../insidir_studio/fonts/JetBrainsMono-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "JBM"; src: url("../../insidir_studio/fonts/JetBrainsMono-ExtraBold.ttf"); font-weight: 800; }
  :root {
    --bg: #050505; --em: #34d399; --em-dim: rgba(52,211,153,.55); --em-faint: rgba(52,211,153,.08);
    --red: #f2555a; --ink: #f4f4f2; --mute: #7c817f; --line: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: var(--bg); overflow: hidden; }
  body { font-family: "JBM", monospace; color: var(--ink); position: relative; -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  #grid { inset: 0; background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 60px 60px; background-position: 0 0; opacity: .35; }
  #vignette { inset: 0; background: radial-gradient(ellipse at 50% 42%, transparent 35%, rgba(0,0,0,.75) 100%); }
  #scan { inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 4px); pointer-events: none; }
  #band { left: 0; right: 0; height: 220px; background: linear-gradient(180deg, transparent, rgba(52,211,153,.035), transparent); }

  /* header */
  #hdr { left: 60px; right: 60px; top: 70px; height: 80px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line); padding-bottom: 18px; }
  #hdr img { height: 62px; margin-left: -14px; }
  #hdr .meta { font-size: 22px; color: var(--mute); letter-spacing: .08em; text-align: right; line-height: 1.5; }
  #hdr .meta b { color: var(--em); font-weight: 700; }

  /* badge */
  #badge { left: 60px; right: 60px; top: 200px; display: flex; justify-content: center; }
  .pill { display: inline-flex; align-items: center; gap: 22px; padding: 20px 34px; border: 1.5px solid rgba(52,211,153,.45);
    background: rgba(52,211,153,.06); border-radius: 999px; font-size: 27px; font-weight: 700; letter-spacing: .06em; color: var(--ink); white-space: nowrap; }
  .dot { position: relative; width: 18px; height: 18px; flex: none; }
  .dot i { position: absolute; inset: 0; border-radius: 50%; background: var(--em); box-shadow: 0 0 16px var(--em); }
  .dot u { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--em); }
  #sub { left: 60px; right: 60px; top: 300px; text-align: center; font-size: 22px; letter-spacing: .14em; color: var(--mute); }
  #sub b { color: var(--em); }

  /* body blocks */
  #body { left: 60px; right: 60px; top: 380px; }
  .card { border: 1.5px solid rgba(255,255,255,.10); background: linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.008));
    border-radius: 18px; padding: 44px 48px; position: relative; }
  .card .corner { position: absolute; width: 22px; height: 22px; border-color: var(--em); border-style: solid; opacity: .8; }
  .lbl { font-size: 22px; letter-spacing: .18em; color: var(--mute); font-weight: 500; }
  .tick { font-size: 220px; font-weight: 800; line-height: 1; letter-spacing: -.02em; color: var(--ink); margin: 14px 0 10px -8px; }
  .tick.md { font-size: 170px; }
  .chip { display: inline-block; font-size: 28px; font-weight: 700; letter-spacing: .06em; color: var(--em); border: 1.5px solid var(--em-dim);
    background: var(--em-faint); padding: 10px 20px; border-radius: 8px; }
  .val { font-size: 128px; font-weight: 800; color: var(--em); line-height: 1.05; letter-spacing: -.02em; margin-top: 12px; }
  .val.md { font-size: 96px; }
  .desc { font-size: 30px; color: #c9ccca; line-height: 1.5; margin-top: 18px; }
  .desc b { color: var(--ink); font-weight: 700; }
  .hr { height: 1px; background: var(--line); margin: 34px 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-top: 28px; }
  .cell { padding: 24px 28px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .cell:nth-child(2n) { border-right: 0; }
  .cell .k { font-size: 19px; letter-spacing: .16em; color: var(--mute); }
  .cell .v { font-size: 32px; font-weight: 700; margin-top: 8px; }
  .cell .v.g { color: var(--em); }

  /* transaction rows (cluster) */
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 30px 34px; border: 1px solid var(--line); border-radius: 14px;
    margin-top: 18px; background: rgba(255,255,255,.015); position: relative; overflow: hidden; }
  .row .who { font-size: 34px; font-weight: 700; }
  .row .meta2 { font-size: 21px; color: var(--mute); letter-spacing: .12em; margin-top: 8px; }
  .row .amt { font-size: 56px; font-weight: 800; color: var(--em); text-align: right; }
  .row .bar { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--em); box-shadow: 0 0 12px var(--em); }

  /* flow bars */
  .flow { margin-top: 30px; }
  .flow .top { display: flex; justify-content: space-between; align-items: baseline; }
  .flow .name { font-size: 26px; letter-spacing: .16em; color: var(--mute); }
  .flow .sum { font-size: 76px; font-weight: 800; }
  .track { height: 64px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid var(--line); margin-top: 14px; overflow: hidden; position: relative; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9px; }
  .fill.buy { background: linear-gradient(90deg, rgba(52,211,153,.35), var(--em)); box-shadow: 0 0 30px rgba(52,211,153,.45); }
  .fill.sell { background: linear-gradient(90deg, rgba(242,85,90,.25), rgba(242,85,90,.85)); }
  .ticks { display: flex; justify-content: space-between; font-size: 18px; color: #4c514f; margin-top: 10px; letter-spacing: .06em; }

  /* chart */
  svg text { font-family: "JBM", monospace; }

  /* log */
  #log { left: 60px; right: 60px; font-size: 21px; line-height: 1.75; color: #5d6361; letter-spacing: .02em; white-space: pre; }
  #log .ok { color: var(--em); }

  /* footer */
  #ftr { left: 60px; right: 60px; bottom: 120px; border-top: 1px solid var(--line); padding-top: 30px; text-align: center; }
  #ftr .brand { font-size: 34px; font-weight: 800; letter-spacing: .08em; }
  #ftr .brand span { color: var(--em); }
  #ftr .tag { font-size: 26px; color: #c9ccca; margin-top: 10px; letter-spacing: .02em; }
  #ftr .disc { font-size: 18px; color: #686d6b; margin-top: 18px; letter-spacing: .14em; }
</style>
</head>
<body>
  <div id="grid" class="abs"></div>
  <div id="band" class="abs"></div>

  <div id="hdr" class="abs">
    <img src="logo.png" alt="">
    <div class="meta"><b data-pulse>●</b> LIVE · FORM 4 FEED<br><span id="clock">UTC 00:00:00.000</span></div>
  </div>

  <div id="badge" class="abs"><div class="pill"><span class="dot"><u></u><i></i></span><span id="badgeText"></span></div></div>
  <div id="sub" class="abs"></div>
  <div id="body" class="abs"></div>
  <div id="log" class="abs"></div>

  <div id="ftr" class="abs">
    <div class="brand">INSIDIR<span>.</span>COM</div>
    <div class="tag" id="tagline"></div>
    <div class="disc">ILLUSTRATIVE DATA · RESEARCH TOOL · NOT INVESTMENT ADVICE</div>
  </div>

  <div id="scan" class="abs"></div>
  <div id="vignette" class="abs"></div>

<script src="scenes.js"></script>
<script>
// ---------- deterministic helpers: every frame is a pure function of t ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, s, d) => clamp((t - s) / d);
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const GLYPHS = "ABCDEF0123456789#$%/<>=+*";
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); return (n ^ (n >>> 15)) >>> 0; }
function scramble(text, p, t, seed) {
  // characters lock in left to right; unlocked ones flicker through terminal glyphs
  const n = text.length, step = Math.floor(t * 30);
  let out = "";
  for (let i = 0; i < n; i++) {
    const c = text[i];
    const lock = (i + 1) / n;
    if (p >= lock || c === " " || c === "•" || c === "|") out += c;
    else if (p >= lock - 0.35) out += GLYPHS[hash(step * 131 + i * 7 + seed) % GLYPHS.length];
    else out += " ";
  }
  return out;
}
const money = v => "$" + Math.round(v).toLocaleString("en-US");

const S = SCENES[new URLSearchParams(location.search).get("scene") || "tsla"];
document.getElementById("body").innerHTML = S.body;
document.getElementById("tagline").textContent = S.tagline;
document.getElementById("sub").innerHTML = S.sub || "";
document.getElementById("log").style.top = S.logTop + "px";
if (S.badgeSize) document.querySelector(".pill").style.fontSize = S.badgeSize + "px";
for (const c of document.querySelectorAll(".card")) {
  const pos = [["left:-1px;top:-1px", "border-width:3px 0 0 3px;border-top-left-radius:18px"],
               ["right:-1px;top:-1px", "border-width:3px 3px 0 0;border-top-right-radius:18px"],
               ["left:-1px;bottom:-1px", "border-width:0 0 3px 3px;border-bottom-left-radius:18px"],
               ["right:-1px;bottom:-1px", "border-width:0 3px 3px 0;border-bottom-right-radius:18px"]];
  for (const [p, b] of pos) { const e = document.createElement("div"); e.className = "corner"; e.style.cssText = p + ";" + b; c.appendChild(e); }
}

// reveal list: [selector or element, kind, start, duration, extra]
const R = [];
document.querySelectorAll("[data-in]").forEach((el, i) => {
  const [kind, s, d] = el.dataset.in.split(",");
  R.push({ el, kind, s: +s, d: +(d || 0.6), text: el.textContent, seed: i * 977,
           to: el.dataset.to ? +el.dataset.to : 0, w: el.dataset.w ? +el.dataset.w : 0 });
});

function render(t) {
  const T = S.duration;
  // background
  document.getElementById("grid").style.opacity = (0.35 * easeOut(prog(t, 0, 0.8))).toFixed(3);
  document.getElementById("grid").style.backgroundPosition = `0 ${(t * 6) % 60}px`;
  document.getElementById("band").style.top = (((t / 4) % 1) * 2300 - 220) + "px";
  const h = 14 * 3600 + 32 * 60 + 7 + t;
  const hh = String(Math.floor(h / 3600)).padStart(2, "0"), mm = String(Math.floor(h / 60) % 60).padStart(2, "0");
  const ss = String(Math.floor(h) % 60).padStart(2, "0"), ms = String(Math.floor((h % 1) * 1000)).padStart(3, "0");
  document.getElementById("clock").textContent = `UTC ${hh}:${mm}:${ss}.${ms}`;
  document.querySelector("[data-pulse]").style.opacity = (0.45 + 0.55 * (0.5 + 0.5 * Math.cos(t * Math.PI * 2))).toFixed(2);
  document.getElementById("hdr").style.opacity = easeOut(prog(t, 0.1, 0.5));

  // badge
  const bp = prog(t, 0.3, 0.9);
  document.getElementById("badge").style.opacity = easeOut(prog(t, 0.25, 0.3));
  document.getElementById("badgeText").textContent = scramble(S.badge, bp, t, 11);
  const ph = (t * 0.8) % 1;
  const ring = document.querySelector(".dot u");
  ring.style.transform = `scale(${1 + ph * 1.8})`; ring.style.opacity = (0.9 * (1 - ph)).toFixed(3);
  document.querySelector(".dot i").style.opacity = (0.7 + 0.3 * Math.cos(t * Math.PI * 1.6)).toFixed(3);
  document.getElementById("sub").style.opacity = easeOut(prog(t, 1.0, 0.5));

  // body reveals
  for (const r of R) {
    const p = prog(t, r.s, r.d);
    if (r.kind === "fade") { r.el.style.opacity = easeOut(p); r.el.style.transform = `translateY(${(1 - easeOut(p)) * 24}px)`; }
    else if (r.kind === "type") { r.el.style.opacity = p > 0 ? 1 : 0; r.el.textContent = scramble(r.text, p, t, r.seed); }
    else if (r.kind === "count") {
      r.el.style.opacity = p > 0 ? 1 : 0;
      const v = r.to * easeExpo(p);
      // keep the final width: pad with figure spaces while counting
      const s = money(v), f = money(r.to);
      r.el.textContent = s.padStart(f.length, " ");
    }
    else if (r.kind === "pct") { r.el.style.opacity = p > 0 ? 1 : 0; r.el.textContent = (r.to * easeExpo(p)).toFixed(1) + "%"; }
    else if (r.kind === "ratio") { r.el.style.opacity = p > 0 ? 1 : 0; r.el.textContent = (r.to * easeExpo(p)).toFixed(2) + "x"; }
    else if (r.kind === "bar") { r.el.style.width = (r.w * easeExpo(p)) + "%"; }
    else if (r.kind === "draw") { const L = r.el.getTotalLength(); r.el.style.strokeDasharray = L; r.el.style.strokeDashoffset = L * (1 - easeOut(p)); }
    else if (r.kind === "pop") { const e = easeOut(p); r.el.style.opacity = e; r.el.setAttribute("r", (r.to * e).toFixed(2)); }
  }

  // card + value glow pulse after the reveal settles
  const pulse = 0.5 + 0.5 * Math.sin((t - 3) * Math.PI * 0.9);
  const settled = prog(t, 2.6, 1);
  document.querySelectorAll(".card").forEach(c => {
    c.style.boxShadow = `0 0 ${40 + 30 * pulse * settled}px rgba(52,211,153,${(0.05 + 0.08 * pulse * settled).toFixed(3)}), inset 0 0 0 1px rgba(52,211,153,${(0.06 * settled).toFixed(3)})`;
  });
  document.querySelectorAll(".glow").forEach(v => {
    v.style.textShadow = `0 0 ${18 + 22 * pulse * settled}px rgba(52,211,153,${(0.35 + 0.3 * pulse * settled).toFixed(3)})`;
  });

  // raw feed log: lines stream in, the newest has a blinking cursor
  const lines = S.log; const out = [];
  for (let i = 0; i < lines.length; i++) {
    const s = S.logStart + i * 0.55;
    const p = prog(t, s, 0.4);
    if (p <= 0) break;
    const L = lines[i]; const n = Math.floor(L.length * p);
    let txt = L.slice(0, n).replace(/OK$|ALERT$|MATCH$|PASS$/, m => `<span class="ok">${m}</span>`);
    out.push(txt);
  }
  const cursor = Math.floor(t * 2) % 2 ? "▌" : " ";
  document.getElementById("log").innerHTML = out.join("\n") + (out.length ? `<span class="ok">${cursor}</span>` : "");
  document.getElementById("log").style.opacity = easeOut(prog(t, S.logStart - 0.2, 0.4));

  document.getElementById("ftr").style.opacity = easeOut(prog(t, 1.6, 0.6));
  // short fade from black and to black for clean edits
  document.body.style.filter = `brightness(${Math.min(easeOut(prog(t, 0, 0.35)), 1 - prog(t, T - 0.4, 0.4)).toFixed(3)})`;
}
window.render = render;
window.DURATION = S.duration;
render(0);
</script>
</body>
</html>
