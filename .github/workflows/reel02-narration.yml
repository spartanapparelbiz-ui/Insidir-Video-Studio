name: Reel 02 — Studio Narration and Timing
on:
  push:
    branches: ['chatgpt/insidirfinance-reel02']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      INSIDIR_STUDIO_HOME: ${{ github.workspace }}/.local-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only free Python narration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Download open-source voice model
        run: python -m insidir_studio download-models
      - name: Produce aligned narration for hand-animated Reel
        run: python examples/render_reel02.py --destination artifacts
      - name: Verify timing and real WAV file
        run: |
          test -s artifacts/reel02-voice.wav
          test -s artifacts/reel02-timing.json
          python - <<'PY'
          import json,wave
          with wave.open('artifacts/reel02-voice.wav','rb') as w:
              d=w.getnframes()/w.getframerate()
          data=json.load(open('artifacts/reel02-timing.json'))
          assert 20 <= data['total'] <= 35
          assert len(data['beats']) == 7
          print("Voice",d,"s; Video",data['total'],"s")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insidirfinance-reel02-voice
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
